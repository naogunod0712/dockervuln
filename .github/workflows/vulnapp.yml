name: Docker w Vulnerable App concurrency

on:
  workflow_dispatch: 

permissions: 
  contents: read
  issues: write
  pull-requests: write

jobs:
  docker-setup:
    name: Docker Compose 
    runs-on: ubuntu-latest

    steps:
    - name: Docker Setup 
      uses: docker/setup-docker-action@v5

    - name: Docker pull and run
      run: "docker pull bkimminich/juice-shop && docker run --rm -d -p 3000:3000 bkimminich/juice-shop" 

    - name: ZAP Baseline Scan
      id: scan-zap
      uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
      with:
        # GitHub Token to create issues in the repository
        token: ${{ secrets.GITHUBB_REPO_TOKEN }}
        # Target URL
        target: http://localhost:3000
        issue_title: ZAP issue report
        # The action status will be set to fail if ZAP identifies any alerts during the baseline scan
        artifact_name: Zap-results
        
    - name: Download a Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: Zap-results
      continue-on-error: true
    
    - name: Verify artifact exists
      run: |
        if [ ! -f "report_json.json" ]; then
          echo "Artifact download failed, attempting recovery..."
          exit 1
        fi

    - name: Parse JSON to be sent
      run: jq -r '.site[]?.alerts[]? | "### 🛠️ " + .name + "\n**How to Fix:**\n" + .solution + "\n\n---"' report_json.json >> $GITHUB_OUTPUT

    - name: Update the GitHub issue board
      run: gh issue {{steps.scan-zap.outputs.issue_number}} --body $GITHUB_OUTPUT

      
        
